<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YouTube 直播留言分句轉送</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="container">
    <h1>YouTube 直播留言分句轉送</h1>
    <section class="form">
      <label>Video ID <input id="videoId" placeholder="例如: dQw4w9WgXcQ" /></label>
      <label>YouTube API Key <input id="apiKey" placeholder="AIza..." /></label>
      <label>External WebSocket URL <input id="externalWsUrl" placeholder="ws://127.0.0.1:9000/ws" /></label>
      <div class="actions">
        <button id="startBtn">開始</button>
        <button id="stopBtn">停止</button>
      </div>
    </section>

    <section>
      <h2>即時事件</h2>
      <pre id="events"></pre>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
